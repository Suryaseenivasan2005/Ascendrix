  <text x="50" y="504" font-size="9" fill="#E5E7EB">Framer Motion v12 (animations) · Radix UI primitives · Lucide Icons</text>
  <text x="50" y="518" font-size="9" fill="#E5E7EB">React Router v7 · React Responsive Masonry · Sonner</text>

  <text x="50" y="538" font-size="10" fill="#D4AF37" font-weight="700">Database &amp; Storage</text>
  <text x="50" y="554" font-size="9" fill="#E5E7EB">Static: Stored as internal constant arrays in component files</text>
  <text x="50" y="568" font-size="9" fill="#E5E7EB">Dynamic (Admin route): Cached and read directly from localStorage</text>

  <!-- Visual Legend Elements -->
  <line x1="510" y1="460" x2="550" y2="460" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="464" font-size="9.5" fill="#E5E7EB">Public Data Flow / Routes</text>

  <line x1="510" y1="485" x2="550" y2="485" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#arr-gold)"/>
