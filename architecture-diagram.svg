  <text x="960" y="520" text-anchor="middle" font-size="10.5" fill="#6B7280">Student Council Platform · Tagore Engineering College</text>
  <text x="960" y="538" text-anchor="middle" font-size="9.5" fill="#3B82F6" font-weight="600">Vite React SPA · 100% Client-Side Architecture</text>

